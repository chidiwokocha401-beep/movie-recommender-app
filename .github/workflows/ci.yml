name: CI

on:
  pull_request: {}
  push:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ./apps/api[dev] -e ./packages/recommender[dev]
      - run: ruff check apps/api packages/recommender
      - run: ruff format --check apps/api packages/recommender
      - run: pytest apps/api packages/recommender

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --prefix apps/web
      - run: npm run lint --prefix apps/web
      - run: npm run build --prefix apps/web
      - run: npm run build-storybook --prefix apps/web
      - uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: apps/web/storybook-static

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ./apps/api[dev] -e ./packages/recommender[dev]
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --prefix apps/web
      - run: npx --prefix apps/web playwright install chromium --with-deps
      - run: uvicorn app.main:app --app-dir apps/api --port 8000 &
      - run: for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/health && break; sleep 2; done
      - run: npm run test:e2e --prefix apps/web

  compose:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-password
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - run: docker compose build
      - run: docker compose up -d postgres redis
      - run: docker compose run --rm api python -m recommender.batch --db "$DATABASE_URL"
        env:
          DATABASE_URL: postgresql://postgres:ci-password@postgres:5432/postgres
      - run: docker compose up -d
      - run: for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/health && break; sleep 5; done
      - run: curl -sf "http://127.0.0.1:8000/users/1/recommendations?k=3"
      - run: docker compose down
