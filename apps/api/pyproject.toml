[project]
name = "movie-recommender-api"
version = "0.1.0"
description = "FastAPI backend for the Movie Recommender App"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "pydantic>=2.6",
    "uvicorn[standard]>=0.29",
    "slowapi>=0.1.9",
    "prometheus-client>=0.20",
    "redis>=5.0",
]

[project.optional-dependencies]
dev = [
    "fakeredis>=2.20",
    "httpx>=0.27",
    "pytest>=8",
    "ruff>=0.4",
]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
"app/main.py" = ["B008"]  # Depends() in defaults is required FastAPI idiom

[tool.pytest.ini_options]
testpaths = ["tests"]
